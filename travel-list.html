<style>
  :root{

  }
  *{box-sizing:border-box;}
  body{
    margin:0;

    background:var(--bg);
    color:var(--ink);
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#2b2b2b,#3f3f3f);
    color:#fff;
    padding:28px 20px 22px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.5rem;
    letter-spacing:.5px;
  }
  header p{
    margin:0;
    font-size:.85rem;
    color:#cfcfcf;
  }
  .controls{
    max-width:960px;
    margin:16px auto 0;
    padding:0 20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  #search{
    flex:1;
    min-width:200px;
    padding:10px 14px;
    border-radius:8px;
    border:none;
    font-size:1rem;
    outline:none;
  }
  .filters{
    max-width:960px;
    margin:14px auto 0;
    padding:0 20px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-btn{
    border:1px solid var(--border);
    background:var(--chip);
    color:var(--ink);
    padding:6px 14px;
    border-radius:999px;
    font-size:.85rem;
    cursor:pointer;
    transition:.15s;
  }
  .filter-btn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .count{
    max-width:960px;
    margin:14px auto 0;
    padding:0 22px;
    font-size:.82rem;
    color:var(--sub);
  }
  .grid{
    max-width:960px;
    margin:14px auto 0;
    padding:0 20px;
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
  }
  .card h2{
    margin:0 0 4px;
    font-size:1.08rem;
  }
  .meta-line{
    font-size:.82rem;
    color:var(--sub);
    margin-bottom:6px;
  }
  .tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin:6px 0;
  }
  .tag{
    font-size:.72rem;
    background:var(--chip);
    color:var(--ink);
    padding:2px 9px;
    border-radius:999px;
    border:1px solid var(--border);
  }
  .scores{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin:6px 0 8px;
  }
  .score-box{
    font-size:.8rem;
    background:#fbf8f2;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 10px;
    min-width:110px;
  }
  .score-box b{
    display:block;
    font-size:1rem;
    color:var(--accent2);
  }
  .score-box.tabelog b{color:var(--accent);}
  .section-label{
    font-size:.78rem;
    font-weight:700;
    color:var(--ink);
    margin-top:8px;
    margin-bottom:2px;
  }
  ul.rec{
    margin:2px 0 6px;
    padding-left:18px;
    font-size:.86rem;
    line-height:1.5;
  }
  .notes{
    font-size:.85rem;
    line-height:1.6;
    color:#444;
    margin-top:4px;
  }
  .addr{
    font-size:.82rem;
    color:var(--sub);
    margin-top:6px;
  }
  .toggle-btn{
    font-size:.78rem;
    color:var(--accent2);
    cursor:pointer;
    margin-top:8px;
    display:inline-block;
    user-select:none;
  }
  .details{
    display:none;
    margin-top:6px;
    border-top:1px dashed var(--border);
    padding-top:8px;
  }
  .details.open{display:block;}
  .badge-nodata{
    font-size:.72rem;
    color:#a06a00;
    background:#fff4dd;
    border:1px solid #f0dcae;
    padding:2px 8px;
    border-radius:999px;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    padding:40px 0;
  }
  footer{
    text-align:center;
    font-size:.75rem;
    color:var(--sub);
    padding:20px;
  }
</style>
</head>

const TYPE_LABELS = {food:"美食",shop:"購物／商店街",sight:"景點",hotel:"住宿"};

function renderStars(v){
  if(!v) return "";
  return v.toFixed(1);
}

function cardHTML(item, idx){
  const scores = [];
  if(item.gRating){
    scores.push(`<div class="score-box"><span>Google評分</span><b>★ ${renderStars(item.gRating)}</b>${item.gReviews? `<span>(${item.gReviews}則)</span>`:''}</div>`);
  }
  if(item.tRating){
    scores.push(`<div class="score-box tabelog"><span>食べログ</span><b>${item.tRating.toFixed(2)}</b>${item.tReviews? `<span>(${item.tReviews}則)</span>`:''}</div>`);
  }
  const recHTML = item.rec && item.rec.length ? `
    <div class="section-label">推薦品項／亮點</div>
    <ul class="rec">${item.rec.map(r=>`<li>${r}</li>`).join('')}</ul>
  ` : '';
  const metaBits = [];
  if(item.hours) metaBits.push(`⏰ ${item.hours}`);
  if(item.price) metaBits.push(`💰 ${item.price}`);
  const metaLine = metaBits.length ? `<div class="meta-line">${metaBits.join(' ・ ')}</div>` : '';
  const addrLine = (item.addr || item.access) ? `<div class="addr">📍 ${item.addr||''}${item.access? ' ・ '+item.access:''}</div>` : '';
  const incompleteBadge = item.incomplete ? `<span class="badge-nodata">資料有限</span>` : '';

  return `
  <div class="card" data-name="${(item.name+' '+(item.jp||'')+' '+(item.cat||'')).toLowerCase()}" data-type="${item.type}">
    <div class="card-top">
      <div>
        <h2>${item.name} ${incompleteBadge}</h2>
        ${item.jp? `<div class="meta-line">${item.jp}</div>`:''}
      </div>
    </div>
    <div class="tags"><span class="tag">${TYPE_LABELS[item.type]||''}</span><span class="tag">${item.cat||''}</span></div>
    ${scores.length? `<div class="scores">${scores.join('')}</div>` : ''}
    ${metaLine}
    ${addrLine}
    <div class="toggle-btn" onclick="this.nextElementSibling.classList.toggle('open'); this.textContent = this.textContent==='▼ 展開詳細介紹'?'▲ 收合':'▼ 展開詳細介紹';">▼ 展開詳細介紹</div>
    <div class="details">
      ${recHTML}
      ${item.notes? `<div class="section-label">評論觀察／備註</div><div class="notes">${item.notes}</div>` : ''}
    </div>
  </div>`;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const activeType = document.querySelector('.filter-btn.active')?.dataset.type || 'all';
  const grid = document.getElementById('grid');
  const filtered = DATA.filter(item=>{
    const matchesType = activeType==='all' || item.type===activeType;
    const haystack = (item.name+' '+(item.jp||'')+' '+(item.cat||'')+' '+(item.notes||'')+' '+(item.rec||[]).join(' ')).toLowerCase();
    const matchesQ = !q || haystack.includes(q);
    return matchesType && matchesQ;
  });
  grid.innerHTML = filtered.map(cardHTML).join('');
  document.getElementById('count').textContent = `顯示 ${filtered.length} / ${DATA.length} 個地點`;
  document.getElementById('empty').style.display = filtered.length? 'none':'block';
}

function buildFilters(){
  const types = ['all','food','shop','sight','hotel'];
  const labels = {all:'全部',food:'美食',shop:'購物／商店街',sight:'景點',hotel:'住宿'};
  const wrap = document.getElementById('filters');
  wrap.innerHTML = types.map(t=>`<button class="filter-btn ${t==='all'?'active':''}" data-type="${t}">${labels[t]}</button>`).join('');
  wrap.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      wrap.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });
}

document.getElementById('search').addEventListener('input', render);
buildFilters();
render();
